apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stoic-quote-web
  namespace: stoic-quote
  labels:
    app.kubernetes.io/name: stoic-quote-web
    app.kubernetes.io/instance: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stoic-quote-web
  # The API is intentionally not autoscaled: its SQLite volume is a single
  # ReadWriteOnce writer and its strategy is Recreate.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
