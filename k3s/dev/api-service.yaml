apiVersion: v1
kind: Service
metadata:
  name: stoic-quote-api
  namespace: stoic-quote-dev
  labels:
    app.kubernetes.io/name: stoic-quote-api
    app.kubernetes.io/instance: dev
spec:
  # LoadBalancer => k3s Klipper LB binds this port on the host, so the API is
  # reachable at http://localhost:8081 — no port-forward needed.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: stoic-quote-api
    app.kubernetes.io/instance: dev
  ports:
    - name: http
      port: 8081
      targetPort: 3000
      protocol: TCP
