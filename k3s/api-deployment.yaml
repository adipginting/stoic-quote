apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoic-quote-api
  namespace: stoic-quote
  labels:
    app.kubernetes.io/name: stoic-quote-api
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: api
spec:
  # Exactly one writer: the SQLite file lives on a ReadWriteOnce volume and
  # better-sqlite3 does not coordinate across replicas.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a second pod must never open the same
    # SQLite file concurrently on the RWO volume.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stoic-quote-api
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stoic-quote-api
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          # GitHub Actions pushes <DOCKERHUB_USERNAME>/stoic-quote-api:<sha>
          # and :latest, then pins this deployment with `kubectl set image`.
          image: docker.io/library/stoic-quote-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # Dataset baked into the image (read-only).
            - name: DATA_DIR
              value: /app/data
            # Writable state on the PVC, never inside the image.
            - name: SQLITE_PATH
              value: /data/stoic.db
            # All keys are optional so the pod starts even before secrets exist.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stoic-quote-secrets
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: DEEPSEEK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: stoic-quote-secrets
                  key: DEEPSEEK_BASE_URL
                  optional: true
            - name: DEEPSEEK_MODEL
              valueFrom:
                secretKeyRef:
                  name: stoic-quote-secrets
                  key: DEEPSEEK_MODEL
                  optional: true
            - name: UNSPLASH_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stoic-quote-secrets
                  key: UNSPLASH_ACCESS_KEY
                  optional: true
            # Observability: disabled unless an OTLP endpoint is configured.
            - name: LOG_LEVEL
              value: info
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: stoic-quote-secrets
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: stoic-quote-secrets
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem still needs scratch space.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stoic-quote-api-data
        - name: tmp
          emptyDir: {}
