apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stoic-quote
  namespace: stoic-quote
  labels:
    app.kubernetes.io/name: stoic-quote
    app.kubernetes.io/instance: production
spec:
  ingressClassName: traefik

  rules:
    - host: stoic.jktlug.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stoic-quote-web
                port:
                  number: 80

    - host: api.stoic.jktlug.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stoic-quote-api
                port:
                  number: 80

  # TLS is issued by cert-manager (install it plus a ClusterIssuer, then
  # uncomment). The secret is created by cert-manager, not manually.
  #
  # tls:
  #   - hosts:
  #       - stoic.jktlug.id
  #       - api.stoic.jktlug.id
  #     secretName: stoic-quote-tls
