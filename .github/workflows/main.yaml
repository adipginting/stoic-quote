# GitHub Actions CI/CD for stoic-quote
#
# Pipeline:
#   verify → docker (matrix: api, web) → deploy
#
# Organization Variables:
#   DOCKERHUB_USERNAME
#
# Organization Secrets:
#   DOCKERHUB_TOKEN
#   KUBECONFIG
#
# KUBECONFIG must be base64-encoded.

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ==========================================================================
  # Build, test, and check the committed dataset
  # ==========================================================================

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The extractor reads the Standard Ebooks submodules under apps/api.
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify committed dataset is up to date
        run: |
          pnpm extract
          git diff --exit-code -- apps/api/data

  # ==========================================================================
  # Build and push Docker images
  # ==========================================================================

  docker:
    needs: verify

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [api, web]

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/stoic-quote-${{ matrix.app }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy to production k3s
  # ==========================================================================

  deploy:
    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      API_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/stoic-quote-api
      WEB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/stoic-quote-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube

          echo "${{ secrets.KUBECONFIG }}" \
            | base64 -d \
            > ~/.kube/config

          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: kubectl cluster-info

      - name: Apply manifests
        run: kubectl apply -f k3s/

      - name: Update deployment images
        run: |
          kubectl set image \
            deployment/stoic-quote-api \
            api=${{ env.API_IMAGE }}:${{ github.sha }} \
            --namespace stoic-quote

          kubectl set image \
            deployment/stoic-quote-web \
            web=${{ env.WEB_IMAGE }}:${{ github.sha }} \
            --namespace stoic-quote

      - name: Wait for rollouts
        run: |
          kubectl rollout status \
            deployment/stoic-quote-api \
            --namespace stoic-quote \
            --timeout=180s

          kubectl rollout status \
            deployment/stoic-quote-web \
            --namespace stoic-quote \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployments --namespace stoic-quote
          kubectl get pods --namespace stoic-quote
