# GitLab CI/CD for stoic-quote
#
# Pipeline:
#   verify → docker (matrix: api, web) → deploy
#
# This mirrors .github/workflows/main.yaml. Images are pushed to Docker Hub and
# the deploy job pins the running k3s deployments to the pushed commit SHA with
# `kubectl set image`.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   DOCKERHUB_USERNAME   Variable  Docker Hub account/org (image namespace)
#   DOCKERHUB_TOKEN      Masked    Docker Hub access token
#   KUBECONFIG           Masked    base64-encoded kubeconfig for the k3s cluster
#
# The manifests expect image names <DOCKERHUB_USERNAME>/stoic-quote-{api,web}.
# To use the GitLab Container Registry instead, set IMAGE_NAME to
# "$CI_REGISTRY_IMAGE/$APP" in the docker job and add a pull secret to the
# k3s deployments.

stages:
  - verify
  - docker
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# ===========================================================================
# Build, test, and check the committed dataset
# ===========================================================================

verify:
  stage: verify
  # node:22-bookworm (not -slim) ships the python3/make/g++ that better-sqlite3
  # needs to compile from source during `pnpm install`.
  image: node:22-bookworm
  variables:
    # The extractor reads the Standard Ebooks submodules under apps/api.
    GIT_SUBMODULE_STRATEGY: recursive
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - npm install -g pnpm@9.0.0
    - pnpm config set store-dir "$PNPM_STORE_DIR"
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build
    - pnpm test
    - pnpm extract
    - git diff --exit-code -- apps/api/data
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ===========================================================================
# Build and push Docker images
# ===========================================================================

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  parallel:
    matrix:
      - APP: [api, web]
  before_script:
    - export IMAGE_NAME="$DOCKERHUB_USERNAME/stoic-quote-$APP"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      docker build \
        --cache-from "$IMAGE_NAME:latest" \
        -f "apps/$APP/Dockerfile" \
        -t "$IMAGE_NAME:$CI_COMMIT_SHA" \
        -t "$IMAGE_NAME:latest" \
        .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ===========================================================================
# Deploy to production k3s
# ===========================================================================

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:1.30
    entrypoint: [""]
  # Never cancel a rollout mid-flight; serialize deploys to one at a time.
  interruptible: false
  resource_group: production
  variables:
    API_IMAGE: "$DOCKERHUB_USERNAME/stoic-quote-api"
    WEB_IMAGE: "$DOCKERHUB_USERNAME/stoic-quote-web"
  before_script:
    # KUBECONFIG is base64-encoded; bitnami runs as non-root so write to /tmp.
    - echo "$KUBECONFIG" | base64 -d > /tmp/kubeconfig
    - chmod 600 /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl cluster-info
    - kubectl apply -f k3s/
    - kubectl set image deployment/stoic-quote-api api="$API_IMAGE:$CI_COMMIT_SHA" --namespace stoic-quote
    - kubectl set image deployment/stoic-quote-web web="$WEB_IMAGE:$CI_COMMIT_SHA" --namespace stoic-quote
    - kubectl rollout status deployment/stoic-quote-api --namespace stoic-quote --timeout=180s
    - kubectl rollout status deployment/stoic-quote-web --namespace stoic-quote --timeout=180s
    - kubectl get deployments --namespace stoic-quote
    - kubectl get pods --namespace stoic-quote
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
